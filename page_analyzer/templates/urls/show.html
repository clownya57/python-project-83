{% extends "base.html" %}

{% block title %}Сайт: {{ url.name }}{% endblock %}

{% block content %}
  <div class="container-lg py-4">
    <h1 class="mb-3">
      Сайт: {{ url.name }}
    </h1>

    <div class="table-responsive">
      <table
        class="table table-bordered"
        data-test="url"
      >
        <tbody>
          <tr>
            <td>ID</td>
            <td>{{ url.id }}</td>
          </tr>

          <tr>
            <td>Имя</td>
            <td>{{ url.name }}</td>
          </tr>

          <tr>
            <td>Дата создания</td>
            <td>
              {{ url.created_at.strftime("%Y-%m-%d") }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <h2 class="mt-5 mb-3">
      Проверки
    </h2>

    <button
      type="button"
      class="btn btn-primary mb-2"
    >
      Запустить проверку
    </button>

    <div class="table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Код ответа</th>
            <th scope="col">h1</th>
            <th scope="col">title</th>
            <th scope="col">description</th>
            <th scope="col">Дата создания</th>
          </tr>
        </thead>
      </table>
    </div>
  </div>
{% endblock %}
