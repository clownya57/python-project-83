{% extends "base.html" %}

{% block title %}Сайты{% endblock %}

{% block content %}
  <div class="container-lg py-4">
    <h1 class="mb-3">
      Сайты
    </h1>

    <div class="table-responsive">
      <table
        class="table table-bordered"
        data-test="urls"
      >
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Имя</th>
            <th scope="col">Последняя проверка</th>
            <th scope="col">Код ответа</th>
          </tr>
        </thead>

        <tbody>
          {% for url in urls %}
            <tr>
              <td>{{ url.id }}</td>

              <td>
                <a
                  href="{{ url_for(
                    'urls_show',
                    url_id=url.id
                  ) }}"
                >
                  {{ url.name }}
                </a>
              </td>

              <td>
                {% if url.last_check_at %}
                  {{ url.last_check_at.strftime("%Y-%m-%d") }}
                {% endif %}
              </td>

              <td></td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
